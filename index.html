<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Son Hamle</title>
  <link rel="stylesheet" href="style.css?v=11">
  <script src="engine.js?v=11" defer></script>
  <script src="difficulty.js?v=11" defer></script>
  <script src="app.js?v=11" defer></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <div id="difficulty" class="difficulty" role="img" aria-label="Tahmini zorluk">
        <span class="difficulty-caption">Zorluk <strong id="difficulty-value">–/5</strong></span>
        <span id="difficulty-stars" class="difficulty-stars" aria-hidden="true"></span>
      </div>
      <p class="eyebrow">SON HAMLE</p>
      <h1 id="level-title">Bölüm 1</h1>
      <p id="counters">Yıldız: 0 · Hamle: 0</p>
    </header>
    <section id="game-view" aria-label="Oyun alanı">
      <div id="board" class="board" aria-label="Tahta"></div>
      <p id="message" class="message" role="status">Bir hücreye tıkla.</p>
      <p id="rule-hint" class="rule-hint" hidden></p>
      <div class="actions">
        <button id="restart" type="button">Yeniden Başlat</button>
      </div>
      <button id="next" class="primary" type="button" hidden>Sonraki Bölüm</button>
    </section>
    <section id="levels-view" hidden aria-label="Bölümler">
      <div id="level-grid" class="level-grid"></div>
      <button id="back" type="button">Oyuna Dön</button>
    </section>
    <button id="levels-toggle" class="outline" type="button">Bölümler</button>
  </main>
  <div id="result" class="result" role="dialog" aria-labelledby="result-title" hidden>
    <button id="result-card" class="result-card" type="button">
      <span id="result-title" class="result-title"></span>
      <span id="result-text" class="result-text"></span>
      <span id="result-action" class="result-action"></span>
    </button>
  </div>
</body>
</html>
